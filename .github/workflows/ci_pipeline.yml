name: CI Pipeline (Airflow‑Like Steps)
'on':
  push:
    branches:
      - main
      - assignment_3_main
  pull_request:
    branches:
      - main
      - assignment_3_main
jobs:
  build-test-index-query:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: 'docker.elastic.co/elasticsearch/elasticsearch:8.6.2'
        ports:
          - '9200:9200'
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          xpack.security.http.ssl.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        options: >-
          --health-cmd="curl -f http://localhost:9200 || exit 1"
          --health-interval=5s --health-timeout=60s --health-retries=30
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: '${{ runner.os }}-pip-${{ hashFiles(''requirements.txt'') }}'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Data‑Pipeline package
        run: pip install -e ./Data-Pipeline
      - name: Configure Kaggle Credentials
        run: >
          mkdir -p ~/.kaggle

          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" >
          ~/.kaggle/kaggle.json

          chmod 600 ~/.kaggle/kaggle.json
        env:
          KAGGLE_USERNAME: '${{ secrets.KAGGLE_USERNAME }}'
          KAGGLE_KEY: '${{ secrets.KAGGLE_KEY }}'
      - name: Cache Data
        uses: actions/cache@v3
        with:
          path: data
          key: '${{ runner.os }}-data-v4'
      - name: Data Acquisition
        run: |
          python - <<EOF
          import os
          from scripts.data_acquisition import download_selected_files
          from data.data_versions import get_data_version, get_data_version_name

          DATA_BASE_DIR = os.path.abspath('data')
          download_selected_files(get_data_version(4), get_data_version_name(4))
          print('Data Acquisition Successful')
          EOF
      - name: Data Preprocessing
        run: |
          python - <<EOF
          import os
          from scripts.data_preprocessing import parse_folder

          folder = os.path.abspath('data/github_test_version')
          data_dict = parse_folder(folder)
          print(f'Length of the dictionary: {len(data_dict)}')
          print('Data Preprocessing Successful')
          EOF
      - name: Data Indexing
        run: >
          python - <<EOF

          import os

          from scripts.data_indexing_elasticsearch import get_index_name,
          index_elasticsearch

          from scripts.data_preprocessing import parse_folder


          folder = os.path.abspath('data/github_test_version')

          data_dict = parse_folder(folder)

          index_name = get_index_name(4)

          print(f'Indexing {len(data_dict)} records into {index_name}')

          index_elasticsearch(data_dict, index_name)

          print('Data Indexing Successful')

          EOF
      - name: Query Elasticsearch
        run: |
          python - <<EOF
          from scripts.es_query import search_custom
          from scripts.data_indexing_elasticsearch import get_index_name

          hits = search_custom(get_index_name(4), 'russia war end', size=10)
          print('Search results:')
          for hit in hits:
            print(f"{hit['_id']} | score={hit['_score']} | {hit['_source']['text']}")
          print('Data Querying Successful')
          EOF
