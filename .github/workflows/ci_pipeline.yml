name: CI Pipeline (Airflow‑Like Steps)
on:
  push:
    branches:
      - assignment_3_main
      - rag
  pull_request:
    branches:
      - assignment_3_main
      - rag
jobs:
  build-test-index-query:
    runs-on: ubuntu-latest
    services:
      elasticsearch:
        image: 'docker.elastic.co/elasticsearch/elasticsearch:8.6.2'
        ports:
          - '9200:9200'
        env:
          discovery.type: single-node
          xpack.security.enabled: 'false'
          xpack.security.http.ssl.enabled: 'false'
          ES_JAVA_OPTS: '-Xms512m -Xmx512m'
        options: >-
          --health-cmd="curl -f http://localhost:9200 || exit 1"
          --health-interval=5s --health-timeout=60s --health-retries=30
    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Cache pip dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: '${{ runner.os }}-pip-${{ hashFiles(''requirements.txt'') }}'
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Install Data‑Pipeline package
        run: pip install -e ./Data-Pipeline
      - name: Download NLTK data
        run: python -m nltk.downloader stopwords
      - name: Configure Kaggle Credentials
        run: >
          mkdir -p ~/.kaggle

          echo "{\"username\":\"$KAGGLE_USERNAME\",\"key\":\"$KAGGLE_KEY\"}" >
          ~/.kaggle/kaggle.json

          chmod 600 ~/.kaggle/kaggle.json
        env:
          KAGGLE_USERNAME: '${{ secrets.KAGGLE_USERNAME }}'
          KAGGLE_KEY: '${{ secrets.KAGGLE_KEY }}'
      - name: Cache Data
        uses: actions/cache@v3
        with:
          path: data
          key: '${{ runner.os }}-data-v4'
      - name: Data Acquisition
        run: |
          python - <<EOF
          import os
          from data_pipeline.scripts.data_acquisition import download_selected_files
          from data_pipeline.data.data_versions import get_data_version, get_data_version_name

          DATA_BASE_DIR = os.path.abspath('data')
          download_selected_files(get_data_version(4), get_data_version_name(4))
          print('Data Acquisition Successful')
          EOF
      - name: Data Preprocessing
        run: |
          python - <<EOF
          import os
          from data_pipeline.scripts.data_preprocessing import parse_folder

          folder = '../data/github_test_version'
          data_dict = parse_folder(folder)
          print(f'Length of the dictionary: {len(data_dict)}')
          print('Data Preprocessing Successful')
          EOF
      - name: Data Indexing
        run: >
          python - <<EOF

          import os

          from data_pipeline.scripts.data_indexing_elasticsearch import get_index_name, index_elasticsearch

          from data_pipeline.scripts.data_preprocessing import parse_folder


          folder = '../data/github_test_version'

          data_dict = parse_folder(folder)

          index_name = get_index_name(4)

          print(f'Indexing {len(data_dict)} records into {index_name}')

          index_elasticsearch(data_dict, index_name)

          print('Data Indexing Successful')

          EOF
      - name: Query Elasticsearch
        run: |
          python - <<EOF
          from data_pipeline.scripts.es_query import search_custom
          from data_pipeline.scripts.data_indexing_elasticsearch import get_index_name

          response = search_custom(get_index_name(4), 'russia war end', size=10)
          print('Search results:')
          
          for hit in response["hits"]["hits"]:
            print(hit)
      
          print('Data Querying Successful')
          EOF

      - name: Assess Normalization Bias
        run: |
          python - <<EOF
          from data_pipeline.scripts.es_query import assess_normalization_bias
          from data_pipeline.scripts.data_indexing_elasticsearch import get_index_name
          
          query_string = "Who is winning the Russia-Ukraine war?"

          # Compare the search scores between the two methods
          assess_normalization_bias(get_index_name(4), query_string, size=10)
          EOF

      - name: Bias Detection and Removal
        run: |
          python - <<EOF
          from data_pipeline.scripts.rag import detect_and_remove_bias
          from data_pipeline.scripts.es_query import search_custom
          from data_pipeline.scripts.data_indexing_elasticsearch import get_index_name
          
          question = "Who is winning the Russia-Ukraine war?"
          response = search_custom(get_index_name(4), question, size=100)
          knowledge_text = detect_and_remove_bias(response)
          print(f"Combined Knowledge test before normalization and removing bias: {knowledge_text['knowledge_text_with_bias']}")
          print(f"Combined Knowledge test after normalization and removing bias: {knowledge_text['knowledge_text_without_bias']}")
          EOF

      - name: RAG Output
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<EOF
          from data_pipeline.scripts.rag import get_results, get_top_tweets
          from data_pipeline.scripts.data_indexing_elasticsearch import get_index_name
          
          question = "Who is winning the Russia-Ukraine war?"
          similarity_threshold = 1.5
          document_count = 10
          temperature = 0.0
          result = get_results(question, get_index_name(4), similarity_threshold, document_count, temperature)
          print(result)
          top_tweets = get_top_tweets(question)
          print(top_tweets)
          EOF

      - name: RAG Sensitivity
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python - <<EOF
          from data_pipeline.scripts.rag import get_results, get_top_tweets
          from data_pipeline.scripts.data_indexing_elasticsearch import get_index_name
          
          question = "Who is winning the Russia-Ukraine war?"
          similarity_threshold = 1.5
          document_count = [3, 5, 10]
          temperature = [0.0, 0.1, 0.2]
          for k in document_count:
            for temp in temperature:
              result = get_results(question, get_index_name(4), similarity_threshold, k, temp)
              print(result)
              top_tweets = get_top_tweets(question)
              print(top_tweets)
          EOF

      - name: Sensitivity Analysis
        run: |
          python - <<EOF
          from data_pipeline.scripts.sensitivity_analysis import run_analysis, create_sentiment_sets
          from data_pipeline.scripts.data_indexing_elasticsearch import get_index_name
          from data_pipeline.scripts.es_query import search_custom
          
          question = "Who is winning the Russia-Ukraine war?"
          run_analysis(get_index_name(4), question, 100)
          
          print("Based on the sensitivity analysis performed on the tweets, we are classifying the tweets in positive, negative, and neutral sets")
          pos_thresh = 0.2
          neg_thresh = -0.2
          response = search_custom(get_index_name(4), question, size=100)
          positive_tweets, neutral_tweets, negative_tweets = create_sentiment_sets(response, pos_thresh, neg_thresh)
          
          print("Positive tweets: ", positive_tweets)
          print("Neutral tweets: ", neutral_tweets)
          print("Negative tweets: ", negative_tweets)
          EOF